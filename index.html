/* beta.29: «Protección de mis datos»: dice si la app está instalada y si el navegador guarda sus datos de forma permanente; «Proteger mis datos» lo pide. Solo informa. */
const IOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent);
async function prSt(){const ins=['standalone','fullscreen','minimal-ui'].some(m=>{try{return matchMedia('(display-mode: '+m+')').matches}catch(e){return false}})||navigator.standalone===true;let per=null;try{if(navigator.storage&&navigator.storage.persisted)per=await navigator.storage.persisted()}catch(e){}return{ins,per}}
function prCard(pr,bt){const ok=pr.ins&&pr.per!==false,c=x=>`style="text-align:right;font-weight:700;color:var(--${x?'ok':'er'})"`,d=bt&&bt.v?Math.floor((Date.now()-bt.v)/864e5):null,ub=d==null?'Ninguno':d<=0?'Hoy':d==1?'Ayer':'Hace '+d+' días',
ins=IOS()?'Instala la app: en Safari, botón Compartir › <b>Agregar a inicio</b>, y ábrela siempre desde su ícono.':'Instala la app: menú del navegador (⋮) › <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>, y ábrela siempre desde su ícono.';
return`<details class=card id=prc ${HOP.prc?'open':''} ontoggle="HOP.prc=this.open"><summary><span><b>Protección de mis datos</b> <span style="font-size:13px;color:var(--${ok?'ok':'er'})">· ${ok?'protegidos':'sin proteger'}</span></span></summary>
<p style="margin:6px 0 10px;font-weight:700;color:var(--${ok?'ok':'er'})">${ok?'✅ Tus datos están protegidos':'⚠️ Tus datos no están protegidos'}</p>
<table class=lt style="width:100%"><tr><td>App instalada</td><td class=nw ${c(pr.ins)}>${pr.ins?'Sí':'No'}</td></tr><tr><td>Guardado permanente</td><td class=nw ${pr.per==null?'style="text-align:right"':c(pr.per)}>${pr.per==null?'No disponible':pr.per?'Sí':'No'}</td></tr><tr><td>Último respaldo</td><td class=nw style="text-align:right">${ub}</td></tr></table>
${ok?'<p class=m style="font-size:13px">El navegador no borrará los datos de la app al limpiar el historial ni por falta de espacio. Solo se borran si desinstalas la app o si borras los «datos de sitios». Aun así, sigue guardando tu respaldo cada semana.</p>':
`<p class=m style="font-size:13px">${pr.ins?'La app está instalada, pero el navegador todavía no guarda sus datos de forma permanente.':'Estás abriendo la app desde el navegador. Así, el navegador puede borrar sus datos al limpiar el historial o si le falta espacio.'+(IOS()?' En iPhone y iPad, Safari también los borra si pasan 7 días sin abrirla.':'')}</p>${pr.per===false?'<button style="width:100%" onclick="prPed()">Proteger mis datos</button>':''}${pr.ins?'':`<p class=m style="font-size:13px">${ins}</p>`}`}</details>`}
async function prPed(){let r=false;try{r=await navigator.storage.persist()}catch(e){}toast(r?'Listo: el navegador guardará tus datos de forma permanente':'El navegador no lo aceptó todavía. Instala la app, ábrela desde su ícono y vuelve a intentarlo.');show()}

const MANUAL=`<h3>1. Qué hace la app</h3><ul><li>Armas la <b>evaluación</b> de cada grupo, materia y parcial: los criterios que llevas (tareas, examen, proyecto, extracurriculares, asistencia…) y cuánto vale cada uno.</li><li>Capturas las calificaciones <b>con botones</b> (10 a 5, NE y +½; 1, ½ y 0; aciertos del examen) y la app calcula el promedio de cada criterio y la calificación del parcial, ya redondeada.</li><li>En <b>Reporte</b> ves la tabla de todo el grupo, la ficha de cada alumno con su cuenta completa y la calificación final del semestre. Puedes calificar desde ahí y descargar en PDF, imagen, CSV o Excel.</li><li>Es compañera de la app <b>Control de Asistencia</b>: de ella puedes traer tus grupos, materias y alumnos, y el <b>% de asistencia</b> de cada alumno. Las dos apps son independientes: lo que haces aquí nunca cambia nada en Asistencia. Si no usas Asistencia, agrega tus grupos y alumnos a mano.</li><li>Todos los datos se guardan <b>solo en este aparato</b>. Haz respaldos (sección 10).</li><li>Arriba a la derecha, el botón <b>?</b> abre la parte de este manual de la pantalla donde estás. Arriba a la izquierda, <b>⏻</b> cierra la app (tus datos quedan guardados).</li><li><b>Subir y bajar</b>: en las pantallas largas, al desplazarte aparecen abajo a la derecha dos botones redondos y transparentes: <b>↑</b> te lleva arriba y <b>↓</b> baja por partes. Se desvanecen solos a los 2 segundos y se esconden mientras hay un aviso abajo. Los avisos se quitan solos, al tocarlos o al desplazarte.</li><li><b>Fechas</b>: en pantalla y en los reportes se escriben día/mes/año (12/11/2026); los archivos para Excel no cambian.</li><li><b>Cambiar de pestaña</b>: con los botones de abajo. Si enciendes Ajustes › Configuración › <b>«Deslizar entre pestañas»</b> (viene apagado), también deslizando el dedo: la pantalla se mueve con él. No se activa con una ventana abierta, con el teclado abierto, sobre una tabla que se desliza de lado ni pegado a la orilla.</li><li><b>Al volver a una pestaña encuentras lo que dejaste</b> (mientras la app esté abierta): la actividad que calificabas y el reporte generado siguen ahí, en el mismo lugar.</li><li><b>Guardar o compartir archivos</b>: en el celular o la tablet, cada archivo pregunta «Guardar en el dispositivo» (Descargas) o «Compartir…» (WhatsApp, correo, Drive…). La opción que usaste la última vez sale primero (en el respaldo y en Mis dispositivos, siempre «Compartir…» primero). También pregunta en la tablet aunque Chrome la abra en modo escritorio. «Compartir…» abre el menú de Android o iPhone en ese mismo toque. Si el navegador no lo abre, la app te dice la razón y te deja tocar «Compartir…» otra vez o guardarlo en el dispositivo: nunca se guarda sin preguntarte. El respaldo y el archivo de Mis dispositivos se comparten como .txt (mismo contenido): se abren y se recuperan igual. <b>Nombres de los archivos</b>: App_Qué_Periodo_Grupo_Materia_Parcial_Fecha_Hora (solo las partes que aplican, sin acentos ni espacios), por ejemplo Tareas_Excel_2026A_1A_PM1_P2_2026-11-12_0950.csv. El periodo sale de la fecha: agosto–enero = A, febrero–julio = B; la materia va abreviada (Pensamiento Matemático I → PM1). Los archivos con el nombre anterior se siguen abriendo igual. El Excel (.xlsx) del reporte no se puede compartir desde el navegador en Android: se guarda en Descargas, la app te avisa y desde ahí lo compartes. En la computadora se descarga directo.</li></ul>
<h3>2. Primeros pasos</h3><ol><li><b>Instala la app</b> y ábrela siempre desde su ícono (sección 9). En Ajustes › <b>Protección de mis datos</b> debe decir «Tus datos están protegidos».</li><li>Ajustes › Configuración: escribe tu nombre (y, si quieres, tu escuela). En Ajustes › <b>Parciales</b> revisa los nombres de tus periodos y, si quieres, sus fechas.</li><li>Pestaña <b>Alumnos</b>: «Traer alumnos de Asistencia» (si usas esa app) o «Agregar a mano» (grupos, materias y alumnos; también puedes pegar una lista).</li><li>Pestaña <b>Calificar</b>: elige grupo, materia y parcial, y pulsa <b>Crear evaluación nueva</b>: agrega tus criterios con su porcentaje (sección 4). Guárdala como plantilla para usarla en tus otros grupos.</li><li>Crea tus actividades dentro de cada criterio y califica.</li><li>Pestaña <b>Reporte</b>: genera el reporte del grupo con los promedios.</li></ol>
<h3>3. Pestaña Calificar</h3><ul><li><b>Fecha, hora y docente</b>: arriba aparecen el día, la fecha y la hora en grande, y tu nombre. En las demás pestañas, un solo renglón con fecha y hora.</li><li><b>Tu grupo de trabajo se recuerda</b>: el grupo, la materia y el parcial que eliges se guardan en el aparato. Al abrir la app vuelves a ellos (arriba sale «3A · … · tu último grupo, recordado al abrir la app»), y Reporte y Alumnos empiezan en ese mismo grupo. Elegir otro grupo en Calificar, Reporte o Alumnos lo cambia para toda la app. En los selectores, la materia sale con su nombre corto (lo que va antes del primer punto) para que quepa en el celular; en reportes, PDF, Excel y el archivo para tu libro va el nombre completo.</li><li><b>Grupo, materia y parcial</b>: elige arriba. Cada combinación tiene su propia evaluación, sus actividades y sus calificaciones.</li><li><b>Evaluación</b>: la tarjeta muestra los criterios con su porcentaje, cuánto suman, el redondeo y qué pasa con lo que no está calificado. «Editar» la cambia (sección 4). Si todavía no la defines, la app te ofrece copiarla de otro parcial o de otro grupo con la misma materia, usar una plantilla o crearla nueva.</li><li><b>Criterios</b>: cada uno es una tarjeta (con su borde verde). Toca su título para abrirla. Dentro están sus actividades con <b>Calificar</b>, el lápiz (nombre y fechas) y ✕ (eliminar con sus calificaciones). <b>+ Nueva actividad</b> crea otra. Si el criterio tiene un máximo de actividades, la app lo dice y no deja pasarse. Dos actividades del mismo criterio no pueden llamarse igual.</li><li><b>Grupos con la misma materia</b> (por ejemplo 1A, 1B y 1C con la misma materia): al crear una actividad, «Agregar también en» la crea en esos grupos (si su evaluación tiene ese criterio). Al editar, «Aplicar también a…» cambia nombre y fechas allá. «Copiar actividades de otro grupo» trae nombre y fechas, nunca calificaciones.</li><li><b>Quién va en rojo</b>: debajo de la evaluación, una tarjeta dice cuántos alumnos van en rojo en ese parcial (su calificación del parcial, con lo capturado hasta hoy, va menor de 6; mismas cuentas del reporte y del Análisis) y quiénes son. Al calificar una actividad, junto a su nombre sale <b class=rx>● 4.8</b>, y se actualiza al capturar. Aparece cuando el parcial ya tiene al menos una actividad calificada (la asistencia sola no cuenta).</li><li><b>Calificar con 10 a 5</b>: cada alumno tiene 10, 9, 8, 7, 6, 5 y NE (no entregó: cuenta 0). Se guarda al tocar. ⌫ lo deja sin calificar. <b>+½</b> suma medio punto a un 6, 7, 8 o 9 (8 y +½ = 8.5); tócalo otra vez para quitarlo. <b>Poner a todos</b> pone la misma calificación a los que no tienen o a todo el grupo; también con +½.</li><li><b>Calificar con 1, ½ y 0</b> (por ejemplo, extracurriculares o participación): 1 cumplió, ½ a medias, 0 no cumplió. En el promedio, 1 vale 10, ½ vale 5 y 0 vale 0.</li><li><b>Examen</b>: escribe el número de reactivos (1 a 100) y la fecha; luego los aciertos de cada alumno o NP (no presentó: cuenta 0). Con hasta 20 reactivos hay botones del 0 al número de reactivos y +½ (medio acierto). También se escriben y Enter pasa al siguiente. La calificación es aciertos × 10 ÷ reactivos (17.5 de 20 = 8.8). Si otros grupos tienen la misma materia, «Reactivos / Fecha: aplicar también en» los pone igual allá; junto a cada grupo dice si ya está igual (✓ en verde) o qué tiene.</li><li><b>Asistencia</b>: si la evaluación tiene el criterio Asistencia, su tarjeta dice cuántos alumnos tienen % de asistencia y de qué fechas. «Importar» lee el archivo que genera la app de Asistencia (sección 7). No se edita a mano.</li><li><b>Si una calificación no se pudo guardar</b> (es raro), el renglón regresa a lo que sí está guardado y arriba queda un aviso rojo: vuelve a capturarla.</li></ul>
<h3>4. La evaluación (criterios y porcentajes)</h3><ul><li><b>Qué es</b>: la «receta» de la calificación de un grupo, materia y parcial. Una lista de criterios, cada uno con su <b>nombre</b>, cuánto <b>vale</b> (%) y <b>cómo se califica</b>.</li><li><b>Formas de calificar</b>: <b>Botones 10 a 5, NE y +½</b> (tareas, proyectos, exposiciones…); <b>Botones 1, ½ y 0</b> (extracurriculares, participación…); <b>Examen</b> (reactivos y aciertos, NP); <b>% de asistencia</b> (viene de la app de Asistencia; solo uno por evaluación).</li><li><b>Agregar</b>: «+ Criterio», «+ Examen», «+ Extracurriculares», «+ Puntos extra» y «+ Asistencia». Escribe el nombre y el porcentaje. En los de 10 a 5 y de 1, ½ y 0 puedes poner un <b>máximo de actividades</b> (vacío = sin límite). Con ↑ y ↓ cambias el orden; ✕ lo quita.</li><li><b>Puntos extra</b>: marca en un criterio la casilla «Puntos extra (no cuenta en el 100 %)» o agrégalo con «+ Puntos extra». Su porcentaje se suma <b>encima</b> de la calificación: por ejemplo Participación +10 %, Homenaje +5 %, Café Literario +3 %. Lo que no esté calificado no suma nada. Sirve para participaciones y actividades extracurriculares (Reto 365, Jardín Polinizador…), cada una con su porcentaje. Un criterio de puntos extra de 1, ½ y 0 con una sola actividad se califica directo con su botón «Calificar».</li><li><b>Total</b>: abajo dice cuánto suma la <b>base</b> (los criterios normales) y, aparte, los puntos extra. La base debe sumar 100 %; si no, la app te avisa al guardar (puedes guardar así, y el promedio se calcula sobre lo que sume).</li><li><b>Redondeo</b> de la calificación del parcial: entero con 5.5 que sube a 6 (de fábrica), un decimal, entero sin subir, o sin redondear.</li><li><b>Lo que todavía no está calificado</b>: «No cuenta» (de fábrica: el promedio se calcula solo con lo calificado y así ves cómo va el alumno) o «Cuenta como 0» (útil al cerrar el parcial; con el libro de Excel activado, las evaluaciones nuevas vienen así, como lo calcula el libro). NE y NP siempre cuentan como 0.</li><li><b>Si es menor de 6, poner 5</b>: casilla de la evaluación, encendida de fábrica.</li><li><b>Cambios</b>: un criterio que ya tiene actividades no puede cambiar de forma de calificar. Si quitas un criterio con actividades, la app pide escribir BORRAR porque se borran con sus calificaciones. Cambiar la evaluación de un parcial no toca los otros parciales ni otros grupos.</li><li><b>Con el libro de Excel activado</b> (Ajustes › Libro de calificaciones de Excel): cada criterio muestra «En mi libro de Excel», la parte del libro donde caen sus calificaciones. <b>La app la propone sola por el nombre</b> al escribirlo: Tareas o Investigaciones → Tareas, Proyecto → Proyectos, Exposición → Exposiciones, Reportes o Integradora → Integradora, Lecciones o Construye-T → Lecciones, Formulario, Bloques, Glosario; un Examen nuevo → Examen. Revísala y cámbiala si no es; lo que eliges tú no se vuelve a cambiar. En los criterios de 1, ½ y 0 (puntos extra) también se elige en el criterio, de la lista Part1, Part2, Homje., Hum. Acc., Act. Socio., Café/Reto, Jard. Poliniz. y Alfab., y se propone por el nombre del criterio (Participación → Part1, Participación 2 → Part2, Homenaje → Homje., Café o Reto → Café/Reto…). Sus actividades van solas a esa columna, así que pueden llamarse como quieras (por ejemplo «Catrinas»). Cada columna lleva un criterio con una actividad; <b>Café/Reto</b> lleva hasta dos (Café Literario y Reto 365) y, como en tu libro, cuenta sobre dos lugares: Café 1 y Reto 0 suma la mitad de su porcentaje. Al elegir la columna, si el porcentaje está vacío se pone el de tu hoja CE. Lo que quede en «(no se exporta)» no sale en el archivo, y la app te avisa.</li><li><b>Tu libro de Excel</b> (con el libro activado): abajo del editor, el cuadro con los porcentajes de la hoja CE de tu libro para esa materia (Pensamiento Matemático, Informática o Robótica) y si la evaluación <b>coincide</b> (✓) o en qué no. <b>Igualar a mi libro</b> pone esos porcentajes, «Cuenta como 0» y «menor de 6 = 5»; revisa y pulsa Guardar. Así la app y tu libro dan la misma calificación. Al exportar, la app te recuerda los grupos que no coinciden.</li><li><b>Pulsa «Guardar evaluación»</b> para que cuente. «← Volver» sin guardar pregunta antes de descartar.</li><li><b>Aplicar a otros grupos y parciales…</b>: pone la misma evaluación (ya guardada) en los grupos con la misma materia y en los parciales que marques; por ejemplo, la armas en 1A Parcial 1 y en un solo paso queda en 1B y 1C, Parcial 1, 2 y 3. Solo copia criterios, porcentajes y reglas, nunca actividades ni calificaciones. Un grupo y parcial que ya tenga actividades en un criterio que aquí no está no se cambia, y la app te dice cuál. Si a mitad del semestre cambias los porcentajes, aplícala solo a los parciales que siguen.</li><li><b>Copiar de otro parcial</b>: cuando un parcial todavía no tiene evaluación, su tarjeta ofrece «Copiar la de Parcial 1» (o del parcial que tenga); se abre el editor con todo listo para revisar y guardar.</li><li><b>Plantillas</b>: «Guardar como plantilla» la guarda con un nombre (por ejemplo, «Matemáticas»). Después, al crear la evaluación de otro grupo o parcial, «Usar una plantilla». Se ven y se borran en Ajustes › Plantillas de evaluación.</li></ul>
<h3>5. Cómo se calcula el promedio</h3><ul><li><b>Promedio de cada criterio</b> (de 0 a 10): el promedio de sus actividades calificadas. NE y NP valen 0. En 1, ½ y 0: 1 = 10, ½ = 5, 0 = 0. Examen: aciertos × 10 ÷ reactivos. Asistencia: el % ÷ 10 (90 % = 9).</li><li><b>Cálculo del parcial</b>: cada promedio por su porcentaje, sumados. Ejemplo: Examen 8.0 × 35 % = 2.80; Tareas 9.0 × 45 % = 4.05; Asistencia 9.0 × 10 % = 0.90; Formulario 10 × 10 % = 1.00; total 8.75.</li><li><b>Puntos extra</b>: cada criterio de puntos extra suma su promedio por su porcentaje encima de la base. Ejemplo: base 8.75; Participación 1 (10 × 10 % = +1.00), Homenaje ½ (5 × 5 % = +0.25), Reto 365 1 (10 × 3 % = +0.30): extra +1.55.</li><li><b>Real y Final</b>: <b>Real</b> = base + extra, sin límite (puede pasar de 10: 8.75 + 1.55 = 10.30). <b>Final</b> = la Real limitada a 10 y con el redondeo de la evaluación (10.30 → 10; sin puntos extra, 8.75 → 9 con «5.5 sube a 6»). <b>Menor de 6 = 5</b> (de fábrica, como en el COBACH): si la Final redondeada queda abajo de 6, se pone 5 (4.3 → 5); la Real conserva el número exacto. Se quita en Editar evaluación.</li><li><b>Semáforo</b> (como en el libro de calificaciones): en el reporte, en sus descargas (PDF, PNG, JPG y Excel) y en la ficha del alumno, una franja de color al inicio del renglón y el nombre teñido muy claro, según su calificación <b>Real</b>: <b>verde</b> 6 o más, <b>amarillo</b> de 5 a 5.9, <b>naranja</b> de 4 a 4.9 y <b>rojo</b> menos de 4. Sin calificaciones, sin color. En el Final del semestre usa la Final. Se quita en Ajustes › Parciales del semestre › «Semáforo en los reportes».</li><li><b>Si un criterio no tiene nada calificado</b> y la regla es «No cuenta», se deja fuera y el cálculo se hace con los demás (sobre lo que sumen sus porcentajes). Con «Cuenta como 0», vale 0.</li><li><b>Final del semestre</b>: el promedio de las calificaciones Final (ya limitadas a 10 y redondeadas) de los parciales que tienen evaluación, con el redondeo de Ajustes › Parciales (y, si está activado, menor de 6 = 5).</li><li>En el reporte, en rojo las calificaciones menores a 6.</li></ul>
<h3>6. Pestaña Reporte</h3><ul><li><b>Cómo se genera</b>: elige grupo (o «Todos mis grupos»), materia, parcial (o «Final del semestre») y qué mostrar, y pulsa <b>Generar reporte</b>. Ya generado, si cambias algo se vuelve a generar solo. «✕ Cerrar reporte» lo quita.</li><li><b>Mostrar</b>: «Todo» (cada criterio con sus actividades, su promedio y su % logrado), «Solo promedios» (el concentrado: el promedio y el % logrado de cada criterio y la calificación) o un solo criterio.</li><li><b>Cómo se lee</b>: cada alumno una vez, con su número de lista. Arriba, en verde, cada criterio con su porcentaje y debajo sus columnas: las actividades (T1, T2… o la clave con que empiecen sus nombres), <b>Entr.</b> (cuántas entregó), <b>Prom.</b> (promedio del criterio) y <b>%</b> («% logrado»: qué parte del porcentaje del criterio obtuvo; por ejemplo Tareas 45 % con promedio 8 → 36 %; en puntos extra, lo que suma: +10 %). Al final, <b>Real</b> (sin límite) y <b>Final</b> (hasta 10 y redondeada); si la evaluación tiene puntos extra, antes van <b>Base</b> y <b>Extra</b>. Abajo, cuántos entregaron, NE / NP, sin calificar y el promedio del grupo; y la clave de cada columna. La tabla tiene su propio desplazamiento: los títulos se quedan arriba y los nombres a la izquierda.</li><li><b>Ficha del alumno</b>: toca su nombre. Muestra cada criterio con sus calificaciones en cuadritos, su promedio y su % logrado (por ejemplo «logró 36 % de 45 %»), y al final Base + Extra = Real y la Final. «← Anterior» y «Siguiente →» pasan al alumno de junto. Los cuadritos con ✎ se pueden tocar para calificar.</li><li><b>Calificar desde el reporte</b>: toca una casilla de una actividad (subrayado punteado): se abre una ventanita con los mismos botones que en Calificar. Se guarda al momento y la tabla (promedios incluidos) cambia sola. «↑ Anterior» y «Siguiente ↓» pasan al alumno de arriba o de abajo. El título de una columna (T1, T2…) abre Calificar de esa actividad; «← Volver al reporte» te regresa en el mismo lugar.</li><li><b>Final del semestre</b>: la calificación de cada parcial y el promedio final. La ficha muestra la cuenta.</li><li><b>Todos mis grupos</b>: una tabla por cada grupo y materia, una debajo de otra; se califica y se abre la ficha igual.</li><li><b>Descargar</b>: <b>PDF</b> (la app elige la hoja: carta vertical, carta horizontal u oficio horizontal), <b>PNG</b> y <b>JPG</b> (una imagen), <b>CSV</b> y <b>Excel</b> (un archivo .xlsx sin macros, con formato listo para imprimir: encabezados por criterio, bordes, en rojo lo menor de 6, NE y NP, nombres y encabezados fijos al desplazarte, horizontal y a lo ancho de la hoja. Con «Todos mis grupos», una hoja por grupo y materia y al inicio la hoja <b>Resumen</b>: alumnos, promedio Real y Final, aprobados, reprobados y % de aprobación de cada grupo).</li></ul>
<p>Arriba de la pestaña, en <b>Tipo</b>, eliges qué generar: <b>Reporte de calificaciones</b> (la tabla de calificaciones) o <b>Análisis de calificaciones</b>. Solo se ve uno a la vez, la app recuerda el último que usaste y al cambiar de tipo se cierra lo que estaba abierto.</p><p><b>Análisis de calificaciones</b>: elige grupo (o «Todos mis grupos») y parcial (o «Final del semestre») y pulsa <b>Generar análisis</b>. Usa las mismas cuentas del reporte y de tu libro (Real, Final redondeada, menor de 6 = 5).</p><ul class=man><li><b>Parcial que todavía no tiene actividades calificadas</b> (solo asistencia): sus números no dicen nada real, así que el Análisis lo avisa en lugar de mostrarlos; «Ver de todos modos» lo muestra esa vez. Con «Todos mis grupos», los grupos-materia que todavía no tienen actividades en ese parcial quedan fuera y se nombran arriba («Incluirlos de todos modos» los agrega). En la Final, si un parcial todavía no tiene actividades, una nota lo dice. Lo mismo va en el PDF y en el Excel.</li><li><b>Avance entre parciales</b> (desde el Parcial 2): por grupo, cuántos <b>subieron</b> ▲, <b>bajaron</b> ▼ o se mantuvieron de un parcial al anterior (cuenta como cambio 1 punto o más), y dos listas para dirección y tutores: <b>Bajaron a rojo</b> (aprobaban y ahora reprueban) y <b>Se recuperaron</b>. Toca un nombre para ver su ficha; en la ficha, junto a cada parcial, ▲ o ▼. En la Final compara el último parcial con calificaciones contra el anterior. También va en el PDF y en el Excel (hoja Avance).</li><li><b>Ir a</b> (todos los botones del mismo tamaño; si el último renglón queda incompleto, se centra): debajo de los totales, un botón por parte (Panorama, Causas, Indicadores, Comparativo, cada grupo y Observaciones) te lleva directo a ella; en cada parte, <b>↑ Índice</b> te regresa. El color de cada grupo (semáforo) se explica una sola vez, arriba. Si no cambiaste nada, al regresar al análisis se muestra al instante, sin volver a calcularlo.</li><li><b>Resumen</b>: cuántos reprobaron de cuántos y el %, la causa principal (el criterio donde perdieron más puntos) y el grupo con más reprobación.</li><li><b>Panorama por grupo</b>: alumnos, reprobados, %, promedio final y lo que más restó.</li><li><b>Causas generales</b>: por criterio, cuántos reprobados perdieron puntos y cuántos (en promedio y en total). Puntos perdidos = (10 − promedio del criterio) × su porcentaje.</li><li><b>Indicadores para dirección</b>: aprobados, reprobados, % de aprobación y de reprobación, promedio y alumnos en riesgo de cada grupo y materia, con el total.</li><li><b>Comparativo</b>: tus grupos de una misma materia lado a lado (promedio, % de reprobación y semáforo).</li><li><b>Cada grupo</b>: criterios y actividades con su fecha, semáforo con gráfica, tendencia de un parcial a otro, actividades más no entregadas y el patrón de los reprobados (qué no entregaron, cómo les fue en el examen).</li><li><b>Alumnos que se listan</b>: «En riesgo» (Real menor de 6: semáforo amarillo, naranja o rojo; de menor a mayor calificación) o «Todos los alumnos» (por número de lista, también los de verde, con el mismo detalle). Cambia la pantalla, el PDF, el Excel y las Fichas.</li><li><b>Cada alumno</b>: Real → Final, lo que le faltó para 6 (hasta 5.5), causa principal, en qué incumplió con los puntos que le costó, sus faltas (con fechas si el % de asistencia viene de Asistencia 2.0.87 o posterior) y <b>cuánto necesita</b> en los parciales que faltan para que su Final del semestre llegue a 6 (si va en verde y le alcanza: «Va aprobando el semestre»; si no perdió puntos: «Sin puntos perdidos»). Toca el nombre para ver su <b>ficha</b>.</li><li><b>Observaciones</b>: la app avisa sola si un examen tiene promedio muy bajo (revisa los aciertos), si la asistencia cuenta muy pocas clases, si un alumno no tiene ninguna entrega (posible abandono), si falta capturar una actividad y si un alumno reprueba dos o más materias contigo.</li><li><b>Descargar</b>: <b>PDF</b> (carta vertical, una hoja por grupo), <b>Excel</b> (hojas Indicadores, Causas, Por grupo, En riesgo (o Alumnos, si eliges todos), Comparativo y Observaciones) y <b>Fichas (PDF)</b>: una hoja por alumno, de los que elegiste en «Alumnos que se listan», con espacio para firmas (para tutorías o para hablar con padres). En la ficha de un alumno, «Descargar ficha (PDF)» saca solo la suya. Si son más de 60 fichas, la app te avisa cuántas hojas serán y te ofrece solo los alumnos en riesgo; mientras se generan ves una barra de progreso («87 de 269») y puedes cancelar. Se arman hoja por hoja para no saturar la memoria de la tablet.</li></ul>
<h3>7. Pestaña Alumnos</h3><ul><li><b>Tres secciones con título</b> (desde la beta.33), igual que en la app de Asistencia: <b>Mi grupo</b> (buscar alumno y la lista), <b>Agregar alumnos</b> (traer de Asistencia, agregar a mano y tus grupos) y <b>De la app de Asistencia</b> (el % de asistencia).</li><li><b>Buscar alumno</b> (arriba): escribe parte del nombre o de la matrícula (al menos 2 letras, sin importar acentos ni mayúsculas) y aparecen los alumnos de todos tus grupos con su grupo; con ✎ lo editas. Si tiene semestres guardados, <b>Historial</b> los muestra; debajo salen también los alumnos de semestres anteriores que ya no están en tus grupos.</li><li><b>Lista de alumnos</b>: en «Grupo», «Todos mis grupos» es la primera opción y cada grupo dice cuántos alumnos tiene. Empieza en tu grupo de trabajo.</li><li><b>Traer alumnos de Asistencia</b> (si usas esa app): en Asistencia, Ajustes › Exportar respaldo; aquí, «Traer alumnos de Asistencia» con ese archivo. Trae grupos, materias (de su horario) y alumnos. La vista previa dice qué cambia (nuevos, cambios de nombre o de grupo, los que ya no están, materias renombradas) y pide confirmar. Antes se guarda una copia para poder deshacer. Repítelo cuando cambien tus alumnos o tu horario allá.</li><li><b>% de asistencia</b>: en la app de Asistencia, Reportes › elige grupo (o Todos mis grupos), materia y el parcial › <b>«Compartir % de asistencia con Tareas»</b>. Aquí: Alumnos › «% de asistencia» › Importar (o «Importar» en la tarjeta Asistencia de Calificar). Elige en qué parcial se guarda (la app propone el que tiene esas fechas). Se liga por nombre de grupo, materia y matrícula; lo anterior de ese grupo, materia y parcial se reemplaza. Solo cuenta si la evaluación tiene el criterio Asistencia.</li><li><b>Agregar a mano</b>: «+ Grupo», «+ Materia de un grupo», «+ Alumno» (matrícula opcional: si no la tienes, la app pone una) y «Pegar una lista» (un alumno por renglón: matrícula y nombre, como al copiar de Excel).</li><li><b>Grupos</b>: cada grupo con sus alumnos y materias. El lápiz cambia su nombre; ✕ borra el grupo (pide escribir BORRAR). La ✕ junto a una materia la quita (si tiene evaluación o actividades, pide BORRAR).</li><li><b>Alumnos</b>: elige el grupo (o Todos los grupos). El lápiz corrige nombre, matrícula o grupo, y tiene <b>Dar de baja</b>.</li><li><b>Bajas</b>: un alumno dado de baja (o que ya no viene en Asistencia) no se borra: deja de calificarse y de salir en los reportes, y conserva sus calificaciones. Aparece en la tarjeta de dados de baja con «Reactivar». «Quitar…» lo borra con sus calificaciones.</li></ul>
<h3>8. Pestaña Ajustes</h3><ul><li><b>Organizada en secciones con título</b> (desde la beta.33): <b>Tu app</b> (Configuración, Parciales y Plantillas), <b>Tus datos</b> (Protección, Respaldo, Mis dispositivos, Historial de semestres y Libro de Excel), <b>Ayuda e información</b> (Ayuda, Actualizaciones y Acerca de) y <b>Salir y borrar</b>.</li><li>Todas las tarjetas aparecen cerradas para no tocar nada por error; tócalas para abrirlas.</li><li><b>Configuración</b>: tu nombre y tu escuela (salen en los reportes; la escuela, también arriba), el tema (claro, oscuro o automático) y «Deslizar entre pestañas».</li><li><b>Parciales</b>: los nombres de tus periodos (de fábrica, Parcial 1, 2 y 3), sus fechas (opcionales), agregar o quitar periodos (uno con evaluaciones no se puede quitar) y el redondeo del final del semestre. Pulsa «Guardar parciales».</li><li><b>Plantillas de evaluación</b>: las que guardaste, con ✕ para borrar.</li><li><b>Protección de mis datos</b>: si la app está instalada, si el navegador guarda los datos de forma permanente y tu último respaldo. «Proteger mis datos» lo pide al navegador.</li><li><b>Respaldo</b>: «Exportar respaldo» (Tareas_Respaldo_….json) y «Restaurar (recuperar) un respaldo…». <b>Deshacer…</b> regresa el aparato a como estaba antes de traer alumnos, restaurar o recibir de Mis dispositivos.</li><li><b>Libro de calificaciones de Excel</b>: exportación especial para un libro de calificaciones con macros; se activa con una clave. Si no la tienes, no la necesitas: todo lo demás funciona igual. Activada, en Calificar aparece «Exportar calificaciones para Excel» (todos los grupos o solo uno, del parcial elegido). Si un criterio tiene más actividades que lugares en el libro, o dos actividades van a la misma columna de 1, ½ y 0 (por ejemplo, dos con Part1; Café/Reto admite dos), la app no exporta y te dice cuáles corregir. <b>Porcentajes de mi hoja CE</b>: la copia de la hoja CE de tu libro (Pensamiento Matemático, Informática y Robótica; criterios y puntos extra), <b>una por parcial</b>, porque cada periodo tiene su libro y su hoja CE. Arriba de la tabla eliges el <b>Parcial</b>; lo que guardas o importas queda solo en ese parcial. Un parcial sin tabla propia usa la del libro v34. <b>Copiar a los demás parciales</b> pone la misma tabla en todos. El cuadro «Tu libro de Excel», «Igualar a mi libro» y el aviso al exportar usan la tabla del parcial de esa evaluación. <b>Importar de mi libro (hoja CE)</b>: elige tu libro de Excel (el .xlsm; pásalo a este aparato por Drive, correo o AirDrop) y la app lee su hoja CE (criterios en la columna B; Pensamiento Matemático, Informática y Robótica en C, D y E). Antes de aplicar te muestra qué porcentajes cambiarían (por ejemplo «Examen: 30 % → 35 %»); pulsa «Aplicar estos porcentajes». No usa macros ni cambia tu libro. Abajo de la tabla, las sumas de cada materia: <b>Base (sin extras)</b> (en rojo si no da 100 %), <b>Extras</b> y <b>Total</b>; se actualizan mientras escribes. La app no cambia tu libro: si cambias CE allá, escribe aquí lo mismo y pulsa Guardar porcentajes. Se guardan en el aparato, viajan en el respaldo y con Mis dispositivos.</li><li><b>Mis dispositivos</b>: para tener lo mismo en tu celular, tablet y computadora: «Enviar a mi otro dispositivo» y, en el otro, «Recibir». Gana el cambio más reciente, dato por dato.</li><li><b>Historial de semestres</b>: el semestre actual dice <b>Al día</b> o <b>Desactualizado</b> (cambiaste datos después de guardarlo; guárdalo otra vez con el mismo nombre). «Borrar calificaciones» te ofrece guardarlo, o actualizarlo si está desactualizado. Guarda la calificación de cada parcial y la Final de todos tus alumnos, por semestre (por ejemplo «2026 A»), para consultarla aunque después borres las calificaciones o el alumno cambie de grupo. «Guardar este semestre en el historial» lo hace con tus datos de hoy (si ya existe ese semestre, se reemplaza); «Agregar un semestre desde un respaldo…» lo calcula de un respaldo viejo de esta app sin cambiar tus datos; ✕ quita un semestre; «Descargar historial (Excel)» da una hoja por semestre. Se consulta por matrícula: en Alumnos › Buscar alumno (botón <b>Historial</b>, también para alumnos que ya no están en tus grupos) y en la ficha del Análisis («Semestres anteriores», también en su PDF). Desde ahí, «Descargar historial (PDF)». Viaja en el respaldo y en Mis dispositivos.</li><li><b>Respaldo pendiente</b>: arriba de Calificar aparece si tienes calificaciones y pasaron 7 días sin respaldo.</li><li><b>Borrar datos</b>: «Borrar calificaciones» (evaluaciones, actividades, calificaciones y % de asistencia; conserva grupos, alumnos y plantillas: útil al empezar otro semestre), «Borrar alumnos y grupos», «Restablecer configuración» (no borra datos) y «Borrar todo». «Borrar calificaciones» primero ofrece guardar el semestre en el historial. Antes preguntan si quieres guardar un respaldo y piden escribir BORRAR.</li></ul>
<h3>9. Instalar y actualizar</h3><ul><li><b>Instalar</b>: abre el enlace con internet. Android (Chrome): menú ⋮ › Instalar aplicación. iPhone (Safari): Compartir › Añadir a pantalla de inicio. Queda un ícono verde «Tareas».</li><li><b>Sin internet</b>: después de la primera carga funciona sin internet; si le falta algo, se repara sola al abrirla con internet.</li><li><b>Actualizar</b>: con internet, la app avisa arriba cuando hay una versión nueva; pulsa Actualizar. También en Ajustes › Actualizaciones. Tus datos no se borran.</li></ul>
<h3>10. Cuidado de tus datos</h3><ul><li>Exporta un respaldo cada semana y guárdalo fuera del aparato (correo o nube).</li><li>No borres las «cookies y datos de sitios» del navegador ni desinstales la app aceptando borrar sus datos: se perderían tus calificaciones (y los datos de otras apps del mismo sitio, como Asistencia). Borrar solo el historial no les hace nada.</li><li><b>Para recuperar</b>: abre la app con internet; Ajustes › Respaldo › «Restaurar (recuperar) un respaldo…» con tu respaldo-tareasg más reciente. Si usas la app en otro aparato, también sirve Mis dispositivos.</li><li>Mis dispositivos no sustituye al respaldo: si algo se borra por error, ese borrado también viaja.</li></ul>
<h3>11. Solución de problemas</h3><ul><li><b>La app aparece vacía</b>: abre el mismo enlace de siempre; si se borraron los datos, recupéralos con tu respaldo (sección 10).</li><li><b>No aparece una materia</b>: agrégala en Alumnos › Agregar a mano, o en el horario de Asistencia y vuelve a traer los alumnos.</li><li><b>El promedio no sale</b>: revisa que la evaluación tenga criterios con porcentaje y que haya algo calificado. Con «No cuenta», un alumno sin nada calificado sale con «—».</li><li><b>La suma no da 100 %</b>: Editar evaluación y corrige los porcentajes.</li><li><b>El % de asistencia no se importa</b>: el grupo y la materia deben llamarse igual que en Asistencia, y el alumno debe tener la misma matrícula. Actualiza Asistencia a la versión 2.0.80 o posterior.</li><li><b>Algo no llega a mi libro de Excel</b>: en Editar evaluación revisa «En mi libro de Excel» de ese criterio (también en los de 1, ½ y 0). Si dice «(no se exporta)», elige su parte del libro. La columna Part2 necesita el libro v34 o posterior.</li><li><b>La app y mi libro no dan lo mismo</b>: en Editar evaluación, el cuadro «Tu libro de Excel» dice en qué no coinciden; pulsa «Igualar a mi libro» y guarda. Si cambiaste los porcentajes de la hoja CE en tu libro, escríbelos también en Ajustes › Libro de calificaciones de Excel › Porcentajes de mi hoja CE.</li><li><b>«Hay 2 exámenes»</b> al exportar: tu libro tiene una sola columna de examen. Deja calificado solo uno.</li><li><b>«Ese archivo es de…»</b>: elegiste otro archivo. Para traer alumnos va el respaldo de Asistencia; para el % de asistencia, el archivo asistencia-pct; para restaurar, el respaldo de esta app; para Mis dispositivos, el archivo tareasg-dispositivos.</li></ul>`;

document.querySelectorAll('details.ms').forEach(d=>{const st=d.querySelector('summary').textContent;d.querySelectorAll('li').forEach(e=>{const tx=nrm(e.textContent);if(w.every(x=>tx.includes(x)))MBL.push([d,e,st,e.textContent])})});

function manRes(i){const x=MBL[i];if(!x)return;x[0].open=true;setTimeout(()=>{x[1].scrollIntoView({block:'center'});manFl(x[1])},30)}
