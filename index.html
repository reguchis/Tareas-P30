<script>
const VER='1.0.0-beta.11';
const LOGO=s=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#15803d"/><rect x="27" y="20" width="46" height="60" rx="6" fill="#fff"/><rect x="40" y="14" width="20" height="12" rx="4" fill="#bbf7d0"/><path d="M35 52l8 8 17-19" fill="none" stroke="#15803d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;z-index:9;background:var(--t);color:var(--bg);padding:12px;border-radius:10px;text-align:center;cursor:pointer';e.title='Toca para cerrar';e.onclick=()=>{e.hidden=true};document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,Math.min(9000,Math.max(3500,t.length*75)))}
function ask(t,f){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px';d.innerHTML=`<div class=card style="max-width:340px"><p>${esc(t)}</p><div class=row><button class=g id=no>Cancelar</button><button id=si style="background:var(--er)">Confirmar</button></div></div>`;document.body.appendChild(d);d.querySelector('#no').onclick=()=>d.remove();d.querySelector('#si').onclick=async()=>{d.remove();await f()}}
function askB(t,f){ask(t,f);const d=document.body.lastElementChild,si=d.querySelector('#si');d.querySelector('p').insertAdjacentHTML('afterend','<label class=dl style="margin:0 0 12px">Para confirmar, escribe BORRAR<input id=askw autocomplete=off autocapitalize=characters spellcheck=false></label>');const w=d.querySelector('#askw');si.disabled=true;w.oninput=()=>{si.disabled=w.value.trim().toUpperCase()!='BORRAR'};w.onkeydown=e=>{if(e.key=='Enter'&&!si.disabled)si.click()};setTimeout(()=>w.focus(),50)}
const $=s=>document.querySelector(s),app=$('#app'),pad=n=>String(n).padStart(2,'0');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),FHM=()=>{const n=new Date();return ymd(n)+'_'+pad(n.getHours())+pad(n.getMinutes())};
const mins=t=>{const[a,b]=t.split(':');return+a*60+ +b},v=id=>document.getElementById(id).value;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=n;document.body.appendChild(a);a.click();a.remove();toast(lb+' (revisa tus descargas)');return true}catch(x){toast('No se pudo descargar: usa la vista previa o copia el texto');return false}}
/* 2.0.19: el cuadro «para copiar» solo muestra archivos pequeños: dibujar varios MB de texto congelaba el celular */
const expSet=(t,n)=>{const e=$('#exp');if(!e)return;e.value=t.length<=200000?t:'El archivo '+(n||'')+' pesa '+(t.length>=1048576?(t.length/1048576).toFixed(1)+' MB':Math.round(t.length/1024)+' KB')+': es demasiado grande para mostrarlo aquí. Ya se generó como archivo.'};
function dl(n,t){expSet(t,n);saveFile(n,n.endsWith('.csv')?'﻿'+t:t)}
const PEN='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
function dlg(t,h,f){const o=$('#dlg');if(o)o.remove();const d=document.createElement('div');d.id='dlg';d.style.cssText='position:fixed;inset:0;z-index:10;background:#0008;display:flex;padding:16px;overflow:auto';
d.innerHTML=`<div class=card style="max-width:360px;width:100%;margin:auto"><b>${t}</b><div id=dlb>${h}</div><p class=er id=de style="margin:10px 0 0" hidden></p><div class=row style="margin-top:14px"><button class=g id=dno>Cancelar</button><button id=dsi>Guardar</button></div></div>`;document.body.appendChild(d);
const er=d.querySelector('#de'),si=d.querySelector('#dsi'),done=()=>{d.remove();show()};d.querySelector('#dno').onclick=()=>d.remove();
si.onclick=async()=>{if(si.disabled)return;si.disabled=true;er.hidden=true;try{const r=await f(done);if(typeof r=='string'){er.textContent=r;er.hidden=false}else if(r===true)done()}finally{si.disabled=false}}}
function prt(t){const o=document.title;let r=false;const back=()=>{if(r)return;r=true;document.title=o;removeEventListener('afterprint',back)};document.title=t;addEventListener('afterprint',back);try{window.print()}finally{setTimeout(back,60000)}}
let NV='';
async function pubVer(){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000),r=await fetch('version.json?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(t);if(r.ok)return String((await r.json()).version||'')}catch(e){}return''}
async function doUpd(nv){nv=nv||NV;if(!nv)return;if(!navigator.onLine)return toast('Sin conexión: conéctate a internet para actualizar');
/* 2.0.9: primero se descarga la versión nueva completa; la copia actual solo se reemplaza cuando la nueva ya quedó guardada. Si falla, la app sigue igual y funcionando sin internet.
   beta.7: GitHub publica los archivos poco a poco (version.json puede cambiar antes que los demás). Si la versión nueva todavía no está completa,
   reintenta sola dos veces y lo dice claro, en vez de culpar a la señal. */
let res='red';for(let i=1;i<=3;i++){toast('Descargando la versión '+nv+(i>1?' (intento '+i+' de 3)':'')+'… no cierres la app');res=await updTry(nv);if(res=='ok')return location.replace(location.pathname+'?v='+encodeURIComponent(nv));if(i<3)await new Promise(z=>setTimeout(z,15000))}
toast(res=='pub'?'La versión '+nv+' todavía se está publicando en GitHub. Tu versión '+VER+' sigue funcionando; inténtalo de nuevo en unos minutos.':'No se pudo descargar la versión '+nv+' por un problema de conexión. Tu versión '+VER+' sigue funcionando; inténtalo de nuevo cuando tengas mejor señal.')}
/* ¿la versión nv ya está publicada completa? Lo dice el sw.js publicado, que lleva el número de versión: true, false (todavía no) o null (sin conexión) */
async function pubListo(nv){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000),r=await fetch('sw.js?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(t);if(!r.ok)return null;return(await r.text()).includes("'tareas-app-"+nv+"'")}catch(e){return null}}
/* un intento de actualizar: 'ok' (la nueva quedó guardada), 'pub' (todavía se está publicando) o 'red' (falló la conexión) */
async function updTry(nv){const L=await pubListo(nv);if(L===null)return'red';if(!L)return'pub';
try{const r='serviceWorker'in navigator&&await navigator.serviceWorker.getRegistration();if(r){await r.update();const w=r.installing||r.waiting;if(w&&!(await new Promise(res=>{const t=setTimeout(()=>res(false),45000),f=()=>{if(w.state=='activated'){clearTimeout(t);res(true)}else if(w.state=='redundant'){clearTimeout(t);res(false)}};w.addEventListener('statechange',f);f()})))return'red'}
const q=await fetch('index.html?t='+Date.now(),{cache:'no-store'});if(!q.ok)return'red';const tx2=await q.text();if(!tx2.includes("const VER='"+nv+"'"))return'pub';
if(window.caches)for(const k of(await caches.keys()).filter(x=>x.startsWith('tareas-app-')))await (await caches.open(k)).put('index.html',new Response(tx2,{headers:{'Content-Type':'text/html; charset=utf-8'}}));return'ok'}catch(e){return'red'}}
async function upd(){if(location.protocol=='file:')return toast('Esta copia es un archivo suelto: para actualizarla, descarga el archivo nuevo.');
if(!navigator.onLine)return toast('Conéctate a internet para buscar actualizaciones');toast('Buscando actualización…');const nv=await pubVer();
if(!nv)return toast('No se pudo comprobar la versión publicada. Revisa tu conexión e inténtalo de nuevo.');
if(nv==VER)return toast('Ya tienes la versión más reciente ('+VER+')');const L=await pubListo(nv);if(L===false)return toast('Ya viene la versión '+nv+', pero GitHub todavía la está publicando. Inténtalo de nuevo en unos minutos.');if(L===null)return toast('No se pudo comprobar la versión publicada. Revisa tu conexión e inténtalo de nuevo.');doUpd(nv)}
let AUN=0;async function autoUpd(){if(!document.querySelector('link[rel=manifest]')||!navigator.onLine)return;const nv=await pubVer();if(!nv||nv==VER)return;
/* beta.7: el aviso sale solo cuando la versión nueva ya está publicada completa; mientras GitHub termina de publicarla, vuelve a revisar cada 2 minutos (hasta 5 veces) */
const L=await pubListo(nv);if(L!==true){if(L===false&&++AUN<=5)setTimeout(autoUpd,120000);return}
NV=nv;const b=$('#updb');if(b){b.querySelector('span').textContent='Nueva versión '+nv+' disponible';b.hidden=false}}
function theme(){const r=document.documentElement,n={auto:'light',light:'dark',dark:'auto'}[r.dataset.theme||'auto'];n=='auto'?r.removeAttribute('data-theme'):r.dataset.theme=n;try{localStorage.setItem(LSP+'th',n)}catch(e){}toast('Tema: '+{auto:'automático',light:'claro',dark:'oscuro'}[n])}

/* TAREAS Y CALIFICACIONES (app personal del docente). Hermana de la app «Control de Asistencia»: de ella solo LEE los alumnos (con el
   respaldo de Asistencia) y nunca escribe nada allá. Las dos viven en el mismo sitio (reguchis.github.io), así que todo lo de esta app
   lleva nombre propio: base de datos «tareas», copias guardadas «tareas-app-…» (solo borra las suyas) y ajustes del navegador «tareas.…».
   Datos (IndexedDB «tareas»):
     groups   {id, name, mats:[materias], u}                 grupos y sus materias, traídos de Asistencia
     students {id, mat, name, gid, out, u}                   alumnos traídos de Asistencia (out = ya no está en Asistencia)
     acts     {id, gid, subject, code, name, ini, fin, n, u} actividades, examen (n = reactivos) y criterios de 0 a 1
     grades   {id:'actividad|alumno', aid, stid, val, u}     calificaciones: número, 'NE', 'NP' o '' (vacío = sin calificar)
     kv       {k, v}                                         ajustes y marcas internas «md|…»

/* ---- MIS DISPOSITIVOS: pasar los datos entre los aparatos del mismo docente con un archivo y combinarlos ----
   Gana el cambio más reciente, dato por dato (si empatan, el del archivo). Lo borrado uno por uno viaja con su marca md|x.
   Como cada aparato trae los alumnos de Asistencia por su lado, los mismos datos pueden tener ids distintos: se reconocen por
   nombre de grupo, matrícula y (grupo, materia, criterio, nombre) de la actividad, y quedan como uno solo. */
const MDT='tareas-dispositivos';let MDF=null,MDR=null;
const mdUndoOff=()=>undoOff();
async function mdSync(){const r=await get('kv','md|sync');return r&&r.v||{}}

async function mdMake(){const L=await mdLocal();return{tipo:MDT,formato:1,app:'tareas',version:VER,generado:Date.now(),docente:cfg.doc||'',groups:L.groups,students:L.students,acts:L.acts,grades:L.grades,gone:L.gone}}
function mdPlan(L,F){const U=x=>+(x&&x.u)||0,map={},fin={},delL={},cnt={};let skip=0;const mid=(s,id)=>map[s]&&map[s][id]||id;

const ref=(s,x)=>s=='groups'?x:mid('groups',x.gid)!=x.gid?{...x,gid:mid('groups',x.gid)}:x;
for(const s of['groups','students','acts']){map[s]=Object.create(null);delL[s]=[];const E=new Map(),FI=new Set(F[s].map(x=>x.id)),LI=new Set(L[s].map(x=>x.id));

for(const y of F[s]){if(!LI.has(y.id)&&dead(L.gone,s,y)){skip++;continue}const e=E.get(y.id);if(e)e.f=y;else E.set(y.id,{f:y})}
const B=new Map();for(const e of E.values()){const v=ref(s,e.l&&e.f?(U(e.f)>=U(e.l)?e.f:e.l):e.l||e.f),k=key[s](v);if(!B.has(k))B.set(k,[]);B.get(k).push({v,ls:e.l?[e.l]:[]})}

/* actividades de grupos que ya no existen, y alumnos sin grupo: se van */
for(const[id,c]of[...fin.acts])if(!fin.groups.has(c.v.gid)){fin.acts.delete(id);delL.acts.push(...c.ls)}
for(const[id,c]of[...fin.students])if(!fin.groups.has(c.v.gid)){fin.students.delete(id);delL.students.push(...c.ls)}
/* calificaciones: una por actividad y alumno; gana la más reciente */
const G2=new Map();delL.grades=[];const viva=(a,t)=>fin.acts.has(a)&&fin.students.has(t);
const add=(x,isF)=>{const aid=mid('acts',x.aid),tid=mid('students',x.stid);if(!viva(aid,tid)){if(!isF)delL.grades.push(x);return}const k=aid+'|'+tid,o=G2.get(k);const ls=isF?[]:[x];if(!o)return G2.set(k,{v:x,ls});const w=U(x)>U(o.v)||U(x)==U(o.v)&&isF?x:o.v;G2.set(k,{v:w,ls:o.ls.concat(ls)})};

for(const s of STS){const o=ops[s]={put:[],del:delL[s].map(x=>x.id)},c=cnt[s]={n:0,c:0,d:delL[s].length},L0=new Map(L[s].map(x=>[x.id,x]));
for(const[id,e]of fin[s]){const cur=L0.get(id);if(!cur||!eq(cur,e.v))o.put.push(e.v);for(const l of e.ls)if(l.id!=id)o.del.push(l.id);

const was=cur||e.ls[0];if(!was)c.n++;else{const a={...was,id:0,u:0},b={...e.v,id:0,u:0};if(s!='groups'&&s!='grades'){a.gid=mid('groups',a.gid);b.gid=mid('groups',b.gid)}if(s=='grades'){a.aid=b.aid;a.stid=b.stid}if(!eq(a,b))c.c++}}}

function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{let o=null;try{o=JSON.parse(String(r.result).replace(/^﻿/,''))}catch(e){}i.value='';
if(o&&o.tipo==MDT)return toast('Ese archivo es de «Mis dispositivos»: se recibe en «Recibir de mi otro dispositivo».');

ask('Restaurar el respaldo del '+mdF(o.generado)+' ('+PL(o.students.length,'alumno','alumnos')+', '+PL(o.acts.length,'actividad','actividades')+', '+PL(o.grades.filter(x=>!tEmpty(x.val)).length,'calificación','calificaciones')+'). Lo que viene en el respaldo vuelve a como estaba ese día; lo que capturaste después y no viene en él se conserva. Antes se guarda una copia para poder deshacer. ¿Restaurar?',()=>rs2(o))};r.readAsText(f)}
async function rs2(o){try{const now=Date.now(),gone={};for(const r of await kvP('md|x|'))gone[r.k.slice(5)]=+r.v||0;const ops={};let k=0;
for(const s of STS){ops[s]={put:[]};const cur=new Map((await all(s)).map(x=>[x.id,x]));for(const x0 of o[s]){if(!x0||typeof x0!='object'||x0.id==null)continue;const x={...x0},e=cur.get(x.id);if(e&&JSON.stringify({...e,u:0})==JSON.stringify({...x,u:0}))continue;const g=gone[s+'|'+x.id];if(g&&g>=(+x.u||0))x.u=Math.max(now,g+1);ops[s].put.push(x);k++}}
if(!k)return toast('El respaldo ya estaba igual que este aparato: no cambió nada.');await undoSave('rs');if(o.cfg&&o.cfg.doc&&!cfg.doc){cfg.doc=SP(o.cfg.doc);ops.kv={put:[{k:'cfg',v:cfg}]}}await mdBulk(ops);toast('Respaldo restaurado ('+PL(k,'dato','datos')+'). Si te equivocaste de archivo, usa «Deshacer la restauración».');show()}catch(e){toast('No se pudo restaurar: '+((e&&e.message)||'error')+'. No se cambió nada.')}}

const MANUAL=`<h3>1. Qué hace la app</h3><ul><li>Capturas las calificaciones de tus grupos con botones: actividades (tareas, actividad integradora, proyectos, bloques, formulario, glosario, exposiciones y lecciones Construye-T), el examen y los criterios de 0 a 1.</li><li>Las pasas a tu libro de calificaciones de Excel con un archivo (de todos tus grupos o de uno solo) y la macro «Importar calificaciones» (Module1 v26).</li><li>Es compañera de tu app de <b>Control de Asistencia</b>: de ella trae los grupos, los alumnos y las materias. Las dos apps son independientes: lo que haces aquí nunca cambia nada en Asistencia.</li><li>Todos los datos se guardan <b>solo en este aparato</b>. Haz respaldos (sección 5).</li><li>Arriba a la derecha, el botón <b>?</b> abre la parte de este manual de la pantalla donde estás.</li><li>Arriba a la izquierda, el botón <b>⏻ Salir</b> (en todas las pestañas) pide confirmación y cierra la app; tus datos quedan guardados. No aparece dentro de este manual ni en la pantalla de salida.</li></ul>
<h3>2. Primeros pasos</h3><ol><li><b>Instala la app</b> (sección 6). Funciona sin internet después de la primera carga.</li><li>En tu app de Asistencia: Ajustes › <b>Exportar respaldo</b>.</li><li>Aquí, pestaña <b>Alumnos</b> › <b>Traer alumnos de Asistencia</b>, elige ese archivo y confirma. Se crean tus grupos con sus alumnos y materias.</li><li>Revisa tu nombre en Ajustes (va en el archivo para Excel).</li><li>Pestaña <b>Calificar</b>: elige grupo y materia, crea tus actividades y califica.</li><li>Para pasar al Excel: «Exportar calificaciones para Excel» › «Todos los grupos», abre el archivo en Excel y, en la hoja de cada grupo, pulsa «Importar calificaciones».</li></ol>
<h3>3. Pestaña Calificar</h3><ul><li><b>Fecha y docente</b>: arriba aparecen la fecha de hoy y tu nombre (el que va en el archivo para Excel); <b>Cambiar</b> abre Ajustes › Configuración. Si todavía no lo escribes, dice «Falta tu nombre» con el botón Escribirlo.</li><li><b>Para qué sirve</b>: capturas en la app las calificaciones de tus actividades, del examen y de los criterios de 0 a 1, y las pasas a tu libro de calificaciones de Excel con un archivo, igual que la asistencia desde la app de Asistencia.</li><li><b>Grupo y materia</b>: elige arriba el grupo y la materia. Cada combinación tiene su propia lista, como cada hoja del Excel (por ejemplo, 5B con dos materias distintas son dos hojas). Las materias de cada grupo vienen del horario de tu app de Asistencia: si falta una, agrégala allá y vuelve a traer los alumnos (sección 4).</li><li><b>Actividades</b>: ocho criterios, cada uno con los lugares que tiene su panel en el Excel: Tareas e Investigaciones (10), Actividad Integradora / Reportes (10), Proyectos (5), Bloques (1), Formulario (1), Glosario (1), Exposiciones (5) y Lecciones Construye-T (5). Toca el criterio para abrirlo, pulsa <b>+ Nueva actividad</b> y escribe nombre, fecha de inicio y fecha final. El botón dice qué lugar ocupará; en el último lugar la app avisa y, con los lugares llenos, ya no deja crear otra. Dos actividades del mismo criterio no pueden llamarse igual, porque el Excel las distingue por el nombre.</li><li><b>Grupos con la misma materia</b> (por ejemplo, 1A, 1B y 1C con Pensamiento Matemático 1): al crear una actividad, «Agregar también en» la crea en esos grupos con el mismo nombre y fechas (vienen marcados; desmarca los que no la lleven). Cada grupo tiene su propia copia: se califica y se exporta por separado. Si en un grupo ya no hay lugar o ya existe con ese nombre, ahí no se crea y la app lo dice. Al editar, «Aplicar también a… en» cambia nombre y fechas de la misma actividad en los grupos que marques (vienen sin marcar), y «Agregar también en» la vuelve a crear en los grupos con la misma materia que no la tienen (por ejemplo, si la eliminaste en 1A, desde 1B puedes volver a agregarla en 1A); llega sin calificaciones. Eliminar solo borra en el grupo donde estás. «Copiar actividades de otro grupo»: eliges el grupo y aparecen sus actividades con casillas, todas marcadas; desmarca las que no quieras traer. Solo se copian nombre y fechas, nunca calificaciones; las que ya existen aquí (mismo nombre) no se tocan y aparecen sin casilla, igual que las de un criterio sin lugares. La app reconoce la misma materia porque se llama igual en el horario de Asistencia de cada grupo.</li><li><b>Calificar una actividad</b>: pulsa <b>Calificar</b>; con LISTO o ← Volver regresas a la lista en el mismo lugar donde estabas. Cada alumno tiene los botones 10, 9, 8, 7, 6, 5 y NE (no entregó; en el Excel cuenta 0). Se guarda al tocar. ⌫ lo deja sin calificar.</li><li><b>Poner a todos</b>: pone la misma calificación de una vez, solo a los alumnos sin calificar o a todo el grupo. Después corriges uno por uno a los que no.</li><li><b>Examen</b>: escribe el número de reactivos (de 1 a 100) y la fecha; luego los aciertos de cada alumno (Enter pasa al siguiente) o <b>NP</b> si no lo presentó (cuenta 0). La app no acepta más aciertos que reactivos y muestra la calificación de cada alumno. Si otros grupos llevan la misma materia, «Reactivos: aplicar también en» (marcado) pone el mismo número de reactivos en su examen, salvo donde ya haya alumnos con más aciertos; «Fecha: aplicar también en» (sin marcar) hace lo mismo con la fecha. Si los reactivos o la fecha ya estaban escritos, marca los grupos y pulsa «Aplicar ahora a los grupos marcados».</li><li><b>Criterios de 0 a 1</b>: Part, Homje, Hum. Acc., Act. Socio., Café Lit., Reto 365, Jard. Poliniz. y Alfab., con los botones 1, ½ y 0 (también con Poner a todos).</li><li><b>Sin calificar</b>: un alumno sin calificación no se toca en el Excel: conserva lo que tenga allá.</li><li><b>Editar o eliminar</b>: el lápiz cambia el nombre y las fechas; ✕ elimina la actividad y sus calificaciones de la app (en el Excel no se borra nada). Si ya la importaste en Excel, no le cambies el nombre: la macro la busca por su nombre y, con uno nuevo, la tomaría como otra actividad.</li><li><b>Exportar calificaciones para Excel › Todos los grupos</b>: genera <b>un solo archivo</b> (calificaciones-excel_todos_exp-fecha.csv) con todos tus grupos y materias. En tu libro (macro Module1 v26 o posterior): abre ese archivo y, en la hoja de cada grupo, pulsa <b>Importar calificaciones</b>. La macro toma del archivo solo lo de esa hoja: el grupo por la celda C1 y las matrículas, y la materia por la celda D1. Si la materia no se llama igual que en la app, la primera vez te pide elegirla de una lista y la recuerda para esa hoja. Si un grupo tiene un problema (más actividades que lugares, o falta el número de reactivos del examen), la app lo salta, exporta los demás y te dice cuál quedó fuera. Con una macro anterior a la v26, Excel dice que no encontró el archivo y no cambia nada.</li><li><b>Exportar calificaciones para Excel › Solo este grupo y materia</b>: genera el archivo calificaciones-excel_grupo_materia_exp-fecha.csv del grupo y la materia elegidos, con sus actividades y todo lo que ya calificaste. En tu libro de calificaciones (macro Module1 v25 o posterior): abre ese archivo, regresa a la hoja del grupo y pulsa <b>Importar calificaciones</b>. La macro busca cada actividad por su nombre (si ya existe la actualiza; si no, usa el siguiente lugar libre de su panel), escribe los aciertos en BB, los reactivos en BB54 y los criterios en las columnas L a S, y antes de escribir muestra un resumen para confirmar. Puedes exportar e importar las veces que quieras: lo nuevo se agrega y lo que ya estaba se actualiza.</li><li><b>Lugares en el Excel</b>: la app cuenta solo las actividades que capturaste aquí. Si en la hoja ya escribiste actividades a mano, quedan menos lugares libres; si alguna no cabe, la macro avisa y no importa nada.</li></ul>
<h3>4. Pestaña Alumnos (traer alumnos de Asistencia)</h3><ul><li><b>De dónde vienen</b>: los grupos, sus alumnos y las materias de cada grupo se traen de tu app de <b>Control de Asistencia</b>. Aquí no se dan de alta alumnos a mano: así siempre coinciden con Asistencia y con tu libro de Excel, que ubica a cada alumno por su matrícula.</li><li><b>Cómo se traen</b>: en la app de Asistencia, Ajustes › <b>Exportar respaldo</b>. Aquí, en Alumnos, pulsa <b>Traer alumnos de Asistencia</b> y elige ese archivo (respaldo-asistencia_….json). También sirve el archivo de «Mis dispositivos» de Asistencia. Nunca se cambia nada en la app de Asistencia.</li><li><b>Vista previa</b>: antes de aplicar, la app dice qué cambiará: grupos nuevos, grupos con materias distintas, alumnos nuevos, alumnos que cambian de nombre, alumnos que cambian de grupo, alumnos que ya no están en Asistencia y alumnos que vuelven. Pulsa <b>Traer alumnos</b> para aplicar o Cancelar. Antes de aplicar se guarda una copia para poder deshacer (sección 5).</li><li><b>Materias</b>: las de cada grupo salen del horario de Asistencia y de las clases que ya tomaste allá. Si falta una materia, agrégala en el horario de Asistencia y vuelve a traer los alumnos.</li><li><b>Alumno que cambia de grupo</b>: sus calificaciones del grupo anterior se conservan, pero ya no salen al exportar ese grupo; en el grupo nuevo aparece sin calificar.</li><li><b>Alumno que ya no está en Asistencia</b> (baja o borrado allá): no se borra solo. Aparece en la tarjeta «ya no están en Asistencia», deja de calificarse y de exportarse, y conserva sus calificaciones. Si vuelve a aparecer en Asistencia, regresa con todo. Con «Quitar…» lo borras de esta app junto con sus calificaciones.</li><li><b>Cuándo repetirlo</b>: cada vez que cambien tus alumnos o tu horario en Asistencia (inicio de semestre, alumno nuevo, cambio de grupo). Puedes repetirlo las veces que quieras: lo que ya está igual no se toca.</li><li><b>Tarjetas plegables</b>: «Grupos» (cada grupo con su número de alumnos y sus materias) y «Alumnos» aparecen cerradas; tócalas para abrirlas (▾) y otra vez para cerrarlas. Mientras la app esté abierta recuerdan cómo las dejaste.</li><li><b>Lista de alumnos</b>: abre la tarjeta «Alumnos» y elige el grupo para ver sus alumnos con su matrícula. Cerrada, la tarjeta muestra el grupo elegido y cuántos alumnos tiene.</li></ul>
<h3>5. Pestaña Ajustes</h3><ul><li><b>Todas las tarjetas de Ajustes aparecen cerradas</b> (plegadas), para no tocar nada por error: «Configuración», «Respaldo», «Mis dispositivos», «Ayuda», «Actualizaciones», «Acerca de la app», «Salir» y «Borrar datos». Van en grupos separados por un espacio: Configuración; tus datos (Respaldo y Mis dispositivos); la ayuda (Ayuda, Actualizaciones y Acerca de la app); y al final Salir y Borrar datos. La única que se abre sola es «Configuración», y solo si todavía no escribes tu nombre (va en el archivo para Excel). Toca el título de la que necesites para abrirla (▾) y otra vez para cerrarla; mientras la app esté abierta recuerdan cómo las dejaste. El «?» de arriba abre el manual aunque la tarjeta Ayuda esté cerrada.</li><li><b>Nombre del docente</b>: va en el archivo para Excel. Si está vacío, se toma del respaldo de Asistencia la primera vez que traes alumnos.</li><li><b>Tema</b>: claro, oscuro o automático; se guarda en este aparato.</li><li><b>Respaldo</b>: «Exportar respaldo» guarda un archivo (respaldo-tareas_aaaa-mm-dd_hhmm.json) con grupos, alumnos, actividades y calificaciones. Es distinto del respaldo de Asistencia: haz los dos. «Restaurar un respaldo»: lo que viene en el respaldo vuelve a como estaba ese día; lo que capturaste después y no viene en él se conserva.</li><li><b>Deshacer</b>: antes de traer alumnos, restaurar un respaldo o recibir de Mis dispositivos, la app guarda una copia. En la tarjeta Respaldo aparece la sección plegada <b>Deshacer…</b> (cerrada, para no tocarla por error): ábrela y pulsa el botón para regresar el aparato a como estaba justo antes (lo capturado después se pierde). Pide confirmación.</li><li><b>Mis dispositivos</b>: para tener las mismas calificaciones en tu celular, tablet y computadora. «Enviar a mi otro dispositivo» genera un archivo (tareas-dispositivos_….json); en el otro aparato, «Recibir de mi otro dispositivo». Gana el cambio más reciente, dato por dato; lo que borras uno por uno (una actividad, un alumno quitado) se borra también en el otro. Aunque cada aparato haya traído los alumnos de Asistencia por su lado, se reconocen por matrícula y por nombre de grupo. Si trabajaste en los dos, envía de uno al otro y luego de regreso.</li><li><b>Ayuda</b>: este manual.</li><li><b>Actualizaciones</b>: la versión instalada y «Buscar actualización».</li><li><b>Salir</b>: cierra la app; tus datos quedan guardados (es lo mismo que el botón ⏻ de arriba a la izquierda).</li><li><b>Borrar datos</b> (plegada): «Borrar calificaciones» (actividades, exámenes, criterios y calificaciones; conserva grupos y alumnos), «Borrar alumnos y grupos» (y con ellos las calificaciones) y «Borrar todo». Todos piden escribir BORRAR y solo borran en este aparato; la app de Asistencia y tu Excel no cambian. Exporta un respaldo antes.</li></ul>
<h3>6. Instalar y actualizar</h3><ul><li><b>Instalar</b>: abre el enlace de la app con internet y espera a que cargue. En Android (Chrome): menú ⋮ › Instalar aplicación. En iPhone (Safari): Compartir › Añadir a pantalla de inicio. Queda como un ícono verde, aparte del de Asistencia.</li><li><b>Sin internet</b>: después de la primera carga funciona sin internet. Si alguna vez le falta algo de su copia sin internet, se repara sola la siguiente vez que la abres con internet.</li><li><b>Junto con Asistencia</b>: las dos apps pueden estar instaladas en el mismo aparato y cada una guarda sus datos aparte. Mantén Asistencia en la versión 2.0.24 o posterior en todos tus aparatos: las anteriores borraban la copia sin internet de las otras apps del mismo sitio.</li><li><b>Actualizar</b>: con internet, la app avisa arriba cuando hay una versión nueva ya publicada completa; pulsa Actualizar. Después de subirla a GitHub, el aviso tarda unos minutos en salir (la app vuelve a revisar sola cada 2 minutos). Si la versión todavía se está publicando, la app lo dice y reintenta sola; solo si de verdad falla la conexión te pide mejor señal. También en Ajustes › Actualizaciones › Buscar actualización. Tus datos no se borran.</li></ul>
<h3>7. Cuidado de tus datos</h3><ul><li>Exporta un respaldo cada semana y guárdalo fuera del aparato (correo o nube).</li><li>No borres los datos de navegación del sitio reguchis.github.io ni desinstales la app aceptando borrar sus datos: se perderían las calificaciones de esta app y también los datos de tu app de Asistencia, que vive en el mismo sitio.</li><li>Si cambias de celular: respaldo en el anterior y Restaurar en el nuevo (y lo mismo en la app de Asistencia).</li><li>Pasar datos con Mis dispositivos no sustituye al respaldo: si algo se borra por error, ese borrado también viaja.</li><li><b>Respaldo, Mis dispositivos o Traer alumnos: ¿cuál es cuál?</b> El <b>respaldo</b> (respaldo-tareas_….json, Ajustes › Respaldo) es tu copia de seguridad: lleva grupos, alumnos, actividades y calificaciones. <b>Mis dispositivos</b> (tareas-dispositivos_….json) es para tener lo mismo en tu celular, tablet y computadora: combina dato por dato y gana el cambio más reciente; no sustituye al respaldo. <b>Traer alumnos de Asistencia</b> usa el respaldo de la app de Asistencia (respaldo-asistencia_….json) y solo trae grupos, materias y alumnos, nunca calificaciones.</li><li><b>Si se borran los datos del navegador: qué se pierde</b>. Borrar solo el <b>historial de navegación</b> no le hace nada a la app. Lo que sí borra todo es borrar las <b>cookies y datos de sitios</b>, usar «Borrar almacenamiento» de Chrome en los ajustes del celular o desinstalar la app aceptando borrar sus datos. Eso borra también la app de Asistencia, porque las dos viven en el mismo sitio. En iPhone, «Borrar historial y datos de sitios web» de Safari también puede borrarlas. Tu libro de Excel no cambia: lo que ya importaste ahí se queda.</li><li><b>Qué archivo te sirve para recuperar</b>: el que sirve es tu <b>respaldo de Tareas</b> (respaldo-tareas_….json): trae grupos, alumnos, actividades y calificaciones; no hace falta volver a traer los alumnos de Asistencia. Si usas la app en otro aparato que no se borró, también sirve <b>Mis dispositivos</b>: en ese aparato pulsa «Enviar a mi otro dispositivo» y aquí «Recibir de mi otro dispositivo»; así recuperas incluso lo que capturaste después de tu último respaldo. El respaldo de Asistencia solo te devuelve grupos y alumnos (con «Traer alumnos de Asistencia»): las calificaciones que no estaban en un respaldo de Tareas ni en otro aparato se pierden, salvo las que ya pasaste a tu Excel.</li><li><b>Pasos para recuperar</b>: 1) abre la app con internet (se vuelve a cargar sola, aunque vacía); 2) en Ajustes › Respaldo, «Restaurar un respaldo», elige tu respaldo-tareas más reciente; 3) vuelve a elegir el tema (claro u oscuro), que se guarda solo en cada aparato. Lo que capturaste después de ese respaldo se pierde, salvo que lo tengas en otro aparato. Recupera también la app de Asistencia con su propio respaldo (en su manual, sección 14); da igual cuál restaures primero.</li><li><b>Para que no te pase</b>: respalda cada semana esta app y la de Asistencia, y guarda los archivos fuera del celular (Drive, correo o WhatsApp a ti mismo). Si vas a limpiar Chrome, en «Borrar datos de navegación» desmarca «Cookies y datos de sitios»: deja marcado solo el historial (y, si quieres, las imágenes y archivos en caché).</li></ul>
<h3>8. Solución de problemas</h3><ul><li><b>La app aparece vacía (sin grupos ni calificaciones)</b>: si usas otro navegador u otro enlace, abre el de siempre. Si se borraron los datos del navegador, recupéralos con tu respaldo de Tareas o con Mis dispositivos (sección 7, «Qué archivo te sirve para recuperar»).</li><li><b>No aparecen grupos ni alumnos</b>: tráelos de Asistencia (sección 4).</li><li><b>No aparece una materia</b>: no está en el horario de ese grupo en Asistencia. Agrégala allá, haz un respaldo en Asistencia y vuelve a traer los alumnos.</li><li><b>Falta un alumno o su nombre está mal</b>: corrígelo en la app de Asistencia y vuelve a traer los alumnos.</li><li><b>«Ese archivo es de esta app de Tareas, no de Asistencia»</b> (o al revés): elegiste otro archivo. Para traer alumnos va el respaldo de Asistencia; para restaurar, el respaldo de esta app; para Mis dispositivos, el archivo tareas-dispositivos.</li><li><b>Al importar calificaciones, Excel dice «criterios que este libro no conoce»</b>: tu libro tiene una macro anterior a la v22. Actualiza Module1 a la v26.</li><li><b>Con el archivo de todos los grupos, Excel dice que no encontró el archivo</b>: tu libro tiene una macro anterior a la v26. Actualiza Module1 a la v26, o usa «Solo este grupo y materia».</li><li><b>Al importar, Excel dice que una actividad no cabe</b>: en esa hoja ya hay actividades escritas a mano en el panel de ese criterio. Libera un lugar en el panel del Excel o elimina una actividad en la app.</li><li><b>Sin internet dice que no se cargó algo</b>: abre la app una vez con internet; su copia sin internet se repara sola.</li></ul>`;
